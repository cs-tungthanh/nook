name: Release

# Push a tag like v1.2.0 to build Nook, publish a GitHub release with
# Nook-1.2.0.zip, and update the cask in cs-tungthanh/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAP_REPO: cs-tungthanh/homebrew-tap
      # Optional: an exported signing certificate (.p12, base64) and its password.
      # With it, every release has the same signature, so macOS keeps Nook's
      # Screen Recording and Microphone permissions across `brew upgrade`.
      # Without it, the build is signed ad-hoc.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      # Optional: the Google OAuth client ID behind Connect YouTube Account.
      # Without it, released builds don't offer that menu item.
      NOOK_YOUTUBE_CLIENT_ID: ${{ secrets.NOOK_YOUTUBE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          # Hand build.sh this certificate by its hash. build.sh only looks for
          # trusted identities (find-identity -v), and a self-signed certificate
          # isn't trusted on the runner, so it would fall back to ad-hoc.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" \
            | awk '/^ *[0-9]+\) [0-9A-F]{40} / { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::MACOS_CERT_P12 holds no code signing identity"
            exit 1
          fi
          echo "NOOK_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build
        run: NOOK_VERSION="$VERSION" ./build.sh

      - name: Package
        run: |
          ZIP="Nook-${VERSION}.zip"
          ditto -c -k --keepParent Nook.app "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "$ZIP" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Nook $VERSION" --generate-notes

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__SHA256__/${SHA256}/" \
            packaging/homebrew/nook.rb | grep -v '^# ' > tap/Casks/nook.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nook.rb
          git commit -m "nook ${VERSION}"
          git push
